[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-vocabulary-batch"
version = "0.1.0"
description = "Offline-safe tooling for populating and generating Japanese vocabulary decks"
requires-python = ">=3.11"
dependencies = ["openai>=1.0"]

[project.scripts]
batch-generate = "japanese_vocabulary_batch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
